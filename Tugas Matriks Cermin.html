<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Output Transformasi Matriks</title>
    <style>
        body { font-family: 'Consolas', monospace; background: #1a1a1a; color: #fff; padding: 20px; }
        .code-container { background: #282c34; padding: 15px; border-radius: 8px; border: 1px solid #444; margin-bottom: 20px; }
        pre { margin: 0; color: #abb2bf; font-size: 13px; overflow-x: auto; }
        
        /* Matplotlib JSHTML Style */
        .output-wrapper { background: white; border-radius: 4px; overflow: hidden; color: #333; width: 100%; max-width: 800px; margin: auto; border: 1px solid #ccc; }
        .canvas { width: 100%; height: 450px; background: #fff; position: relative; border-bottom: 1px solid #ddd; }
        
        /* Koordinat & Grid */
        .grid-container { position: absolute; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(16, 1fr); grid-template-rows: repeat(16, 1fr); }
        .grid-container div { border: 0.1px solid #f0f0f0; }
        .axis-x { position: absolute; width: 100%; height: 2px; background: #000; top: 50%; z-index: 1; }
        .axis-y { position: absolute; height: 100%; width: 2px; background: #000; left: 50%; z-index: 1; }

        /* Objek Grafik */
        .shape-container { position: absolute; width: 6.25%; height: 6.25%; border: 3px dashed; transform: translate(-50%, -50%); z-index: 2; display: flex; flex-wrap: wrap; }
        .blue-line { border-color: blue; }
        .red-line { border-color: red; }
        .point-label { position: absolute; font-size: 10px; font-weight: bold; white-space: nowrap; }

        /* Controls Panel */
        .controls-panel { background: #fff; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .slider-row { width: 80%; display: flex; align-items: center; gap: 10px; }
        .slider { flex-grow: 1; cursor: pointer; }
        .btn-row { display: flex; gap: 2px; }
        .btn { padding: 4px 8px; background: #f0f0f0; border: 1px solid #ccc; cursor: pointer; font-size: 12px; border-radius: 2px; }
        .btn:hover { background: #e0e0e0; }
        .mode-row { display: flex; gap: 15px; font-size: 12px; margin-top: 5px; }
        .active-mode { font-weight: bold; }
    </style>
</head>
<body>

<div class="code-container">
<pre><code># KODE PYTHON
import numpy as np
import matplotlib.pyplot as plt
from matplotlib import animation
from IPython.display import HTML

# (Logika animasi seperti yang diminta)
ani = animation.FuncAnimation(fig, animate, frames=9, interval=800, blit=True)
HTML(ani.to_jshtml())</code></pre>
</div>

<div class="output-wrapper">
    <div class="canvas" id="main-canvas">
        <div class="grid-container" id="grid"></div>
        <div class="axis-x"></div>
        <div class="axis-y"></div>
        
        <div id="box-top" class="shape-container blue-line" style="left: 65.625%; top: 31.25%;">
            <div id="lbl-t1" class="point-label" style="color: blue; top: -15px; left: 0;">(2,3)</div>
            <div id="lbl-t2" class="point-label" style="color: blue; top: -15px; right: 0;">(3,3)</div>
        </div>

        <div id="box-bot" class="shape-container red-line" style="left: 65.625%; top: 71.875%;">
            <div id="lbl-b1" class="point-label" style="color: red; bottom: -15px; left: 0;">(2,-4)</div>
            <div id="lbl-b2" class="point-label" style="color: red; bottom: -15px; right: 0;">(3,-4)</div>
        </div>
    </div>

    <div class="controls-panel">
        <div class="slider-row">
            <input type="range" class="slider" id="scrubber" min="0" max="8" value="0" oninput="manualSeek(this.value)">
        </div>
        
        <div class="btn-row">
            <button class="btn" onclick="step(-9)">&#9646;&#9664;</button>
            <button class="btn" onclick="step(-1)">&#9664;</button>
            <button class="btn" id="play-btn" onclick="togglePlay()">&#9654;</button>
            <button class="btn" onclick="step(1)">&#9654;</button>
            <button class="btn" onclick="step(9)">&#9654;&#9646;</button>
        </div>

        <div class="mode-row">
            <label><input type="radio" name="mode" value="once" onchange="setMode(this.value)"> Once</label>
            <label><input type="radio" name="mode" value="loop" checked onchange="setMode(this.value)"> Loop</label>
            <label><input type="radio" name="mode" value="reflect" onchange="setMode(this.value)"> Reflect</label>
        </div>
    </div>
</div>

<script>
    let currentFrame = 0;
    let isPlaying = false;
    let playMode = 'loop';
    let dir = 1;
    let timer;

    // Build Grid
    const grid = document.getElementById('grid');
    for(let i=0; i<256; i++) grid.appendChild(document.createElement('div'));

    function update() {
        // Skala: 1 unit = 6.25% (100/16)
        let yTop = 50 - ((3 - currentFrame) * 6.25);
        let yBot = 50 - ((-4 + currentFrame) * 6.25);

        document.getElementById('box-top').style.top = yTop + '%';
        document.getElementById('lbl-t1').innerText = `(2,${3-currentFrame})`;
        document.getElementById('lbl-t2').innerText = `(3,${3-currentFrame})`;

        document.getElementById('box-bot').style.top = yBot + '%';
        document.getElementById('lbl-b1').innerText = `(2,${-4+currentFrame})`;
        document.getElementById('lbl-b2').innerText = `(3,${-4+currentFrame})`;

        document.getElementById('scrubber').value = currentFrame;
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        const btn = document.getElementById('play-btn');
        btn.innerHTML = isPlaying ? '&#10074;&#10074;' : '&#9654;';
        
        if(isPlaying) {
            timer = setInterval(() => {
                currentFrame += dir;
                if(currentFrame > 8 || currentFrame < 0) {
                    if(playMode === 'once') {
                        currentFrame = (currentFrame > 8) ? 8 : 0;
                        togglePlay();
                    } else if(playMode === 'loop') {
                        currentFrame = 0;
                    } else if(playMode === 'reflect') {
                        dir *= -1;
                        currentFrame += (dir * 2);
                    }
                }
                update();
            }, 800);
        } else {
            clearInterval(timer);
        }
    }

    function manualSeek(v) { currentFrame = parseInt(v); update(); }
    function step(v) { currentFrame = Math.max(0, Math.min(8, currentFrame + v)); update(); }
    function setMode(m) { playMode = m; dir = 1; }
</script>

</body>
</html>
